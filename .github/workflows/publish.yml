name: Publish Go SDK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.22"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$VERSION" | grep -Eq '^3\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be 3.x.y to match the v3 module path"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

      - name: Build
        run: go build ./...

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Create tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to the Go module proxy
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          url="https://proxy.golang.org/github.com/goperigon/perigon-go-sdk/v3/@v/v${VERSION}.info"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$url"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Module proxy did not serve v${VERSION}"
          exit 1
